<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<link rel="stylesheet" href="/front-end/components/header/header.css" />
		<link rel="stylesheet" href="/front-end/components/footer/footer.css" />
		<link rel="stylesheet" href="/front-end/assets/styles/global.css" />
		<link rel="stylesheet" href="styles.css" />
		<title>register</title>
	</head>
	<body>
		<header id="head"></header>

		<main>
			<div class="connexion-hero flex-column">
				<div>
					<img src="/front-end/assets/pictures/Logo.png" alt="" />
				</div>
				<p>TalentHub</p>
			</div>
			<div class="form-content flex-column">
				<h1 class="title-form">creer un compte</h1>
				<form action="" method="" class="connexion-form flex-column">
					<div class="first-register-page flex-column">
						<div class="input-group flex-column">
							<label for="last-name"
								><span>
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="24"
										height="24"
										viewBox="0 0 24 24"
										!
										fill="none"
										stroke="currentColor"
										stroke-width="2"
										stroke-linecap="round"
										stroke-linejoin="round"
									>
										<path
											d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"
										/>
										<circle cx="12" cy="7" r="4" />
									</svg> </span
								><span>nom:</span>
							</label>
							<input
								type="text"
								name="last-name"
								id="last-name"
							/>
						</div>
						<div class="input-group flex-column">
							<label for="first-name"
								><span>
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="24"
										height="24"
										viewBox="0 0 24 24"
										!
										fill="none"
										stroke="currentColor"
										stroke-width="2"
										stroke-linecap="round"
										stroke-linejoin="round"
									>
										<path
											d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"
										/>
										<circle cx="12" cy="7" r="4" />
									</svg> </span
								><span>prenom:</span>
							</label>
							<input
								type="text"
								name="first-name"
								id="first-name"
							/>
						</div>
						<div class="input-group flex-column">
							<label for="tel"
								><span>
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="24"
										height="24"
										viewBox="0 0 24 24"
										fill="none"
										stroke="currentColor"
										stroke-width="2"
										stroke-linecap="round"
										stroke-linejoin="round"
									>
										<path d="M13 2a9 9 0 0 1 9 9" />
										<path d="M13 6a5 5 0 0 1 5 5" />
										<path
											d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"
										/>
									</svg> </span
								><span>telephone:</span>
							</label>
							<input type="tel" name="tel" id="tel" />
						</div>
						<div class="flex-row" id="next">
							<span>suivant</span>
							<span
								><svg
									xmlns="http://www.w3.org/2000/svg"
									width="24"
									height="24"
									viewBox="0 0 24 24"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round"
								>
									<path d="M5 12h14" />
									<path d="m12 5 7 7-7 7" />
								</svg>
							</span>
						</div>
					</div>
					<div class="second-register-page flex-column">
						<div class="input-group flex-column">
							<label for="email"
								><span>
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="24"
										height="24"
										viewBox="0 0 24 24"
										fill="none"
										stroke="currentColor"
										stroke-width="2"
										stroke-linecap="round"
										stroke-linejoin="round"
									>
										<path
											d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"
										/>
										<rect
											x="2"
											y="4"
											width="20"
											height="16"
											rx="2"
										/>
									</svg> </span
								><span>email:</span>
							</label>
							<input type="email" name="email" id="email" />
						</div>
						<div class="input-group flex-column">
							<label for="password">
								<span>
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="24"
										height="24"
										viewBox="0 0 24 24"
										fill="none"
										stroke="currentColor"
										stroke-width="2"
										stroke-linecap="round"
										stroke-linejoin="round"
									>
										<rect
											width="18"
											height="11"
											x="3"
											y="11"
											rx="2"
											ry="2"
										/>
										<path d="M7 11V7a5 5 0 0 1 10 0v4" />
									</svg>
								</span>
								<span>mot de passe: </span></label
							>
							<input
								type="password"
								name="password"
								id="password"
								required
							/>
							<p class="forgot-password">mot de passe oublié</p>
						</div>
						<div class="input-group flex-column">
							<label for="password-confirmed">
								<span>
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="24"
										height="24"
										viewBox="0 0 24 24"
										fill="none"
										stroke="currentColor"
										stroke-width="2"
										stroke-linecap="round"
										stroke-linejoin="round"
									>
										<rect
											width="18"
											height="11"
											x="3"
											y="11"
											rx="2"
											ry="2"
										/>
										<path d="M7 11V7a5 5 0 0 1 10 0v4" />
									</svg>
								</span>
								<span>confirmer: </span></label
							>
							<input
								type="password"
								name="password-confirmed"
								id="password"
								required
							/>
						</div>
						<div class="flex-row" id="previous">
							<span><svg
								xmlns="http://www.w3.org/2000/svg"
								width="24"
								height="24"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
							>
								<path d="m12 19-7-7 7-7" />
								<path d="M19 12H5" />
							</svg></span>
							<span>precedant</span>
						</div>
						<button class="login-button btn-good" type="submit">
							creer un compte
						</button>
					</div>
				</form>
			</div>
		</main>

		<footer id="foot"></footer>

		<script src="main.js" type="module"></script>
	</body>
</html>
