<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="/front-end/components/header/header.css" />
    <link rel="stylesheet" href="/front-end/components/footer/footer.css" />
    <link rel="stylesheet" href="/front-end/assets/styles/global.css" />
    <title>order</title>
  </head>
  <body>
    <header id="hd"></header>
    <main class="flex-column">
      <div class="msg-confirm">
        <p>bravo vous venez debvoyer une commande pour le servuce suivant:</p>
      </div>
      <div class="order-details">
        <p>
          <span class="service-title"></span> proposer par
          <span class="service-owner"></span>
        </p>
        <div class="packs flex-column">
          <p class="pack-title">Pack Basic</p>
          <p class="packs-price">
            prix :
            <span class="service-prix" id="price"></span>FCFA
          </p>
          <p class="packs-delivery">
            livraison standard:
            <span class="service-delivery" id="delivery"></span>
            jours
          </p>
          <ul class="packs-feature" id="features"></ul>
        </div>
        <button class="btn-good contacter">contacter</button>
      </div>
    </main>
    <footer id="f"></footer>
    <!-- apel des differents scripts -->
    <script src="main.js" type="module"></script>
  </body>
</html>
