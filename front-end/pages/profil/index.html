<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="/front-end/components/header/header.css" />
    <link rel="stylesheet" href="/front-end/components/footer/footer.css" />
    <link
      rel="stylesheet"
      href="../../components/service-card/service_card.css"
    />
    <link rel="stylesheet" href="../../components/etoile/etoile.css" />
    <link
      rel="stylesheet"
      href="../../components/review-card/review-card.css"
    />
    <link rel="stylesheet" href="/front-end/assets/styles/global.css" />
    <link rel="stylesheet" href="../../components/portfolio-card/portfolio-card.css">
    <title>profil</title>
  </head>

  <body>
    <header id="head"></header>
    <main>
      <section id="hero" class="flex-row">
        <div class="profil-container profil">
          <img
            src="/front-end/assets/pictures/profil1.jpg"
            alt="profil"
            class="profil-image"
          />
        </div>
        <div>
          <div class="personal-infos flex-column">
            <h1 class="name"></h1>
            <div class="pseudo"></div>
            <p class="email"></p>
          </div>
          <div class="rating-infos flex-row">
            <div class="rating"></div>
            <div class="reviews"></div>
            <div class="projects"></div>
          </div>
          <div class="professinal-infos flex-row">
            <h2 class="job-title"></h2>
            <p class="experience"></p>
            <div class="since"></div>
          </div>
        </div>
      </section>

      <section id="about">
        <h2>A Propos</h2>
        <p class="about-content"></p>
      </section>

      <section id="skills">
        <h2>Skills</h2>
        <ul>
          <li>HTML</li>
          <li>CSS</li>
          <li>JavaScript</li>
          <li>React</li>
        </ul>
      </section>

      <section id="portfolio">
        <template id="portfolio-template">
          <div class="project">
            <div  class="project-img-content">
              <img
                src="/front-end/assets/pictures/project1.jpg"
                alt="Project 1"
                class="project-image"
              />
            </div>
            <h3 class="project-title">Project Title</h3>
            <p class="project-description">Project description goes here.</p>
          </div>
        </template>
        <h2>Portfolio</h2>
        <p>Here are some of my recent projects:</p>

        <article id="my-portfolios-container" class="flex-column"></article>
      </section>

      <section id="services">
        <h2>Services</h2>
        <template id="service-template" class="flex-column">
          <div class="service flex-column">
            <span class="service-favorite">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"
                />
              </svg>
            </span>
            <div class="service-img"></div>
            <p class="service-title"></p>
            <div class="service-review flex-row">
              <p class="flex-row">
                <span class="service-note">4.5</span
                ><span class="service-star"></span>
              </p>
              <p class="flex-row">(<span class="service-avis"></span>avis)</p>
            </div>

            <div class="service-meta flex-row">
              <p><span class="service-prix"></span>FCFA</p>
              <p class="flex-row">
                <span
                  ><svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.3"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M12 6v6l4 2" />
                    <circle cx="12" cy="12" r="10" /></svg
                ></span>
                <span class="service-delivery"></span> jours
              </p>
            </div>
            <div class="service-profil flex-row" style="display: none">
              <div class="service-profil-container profil"></div>
              <div class="service-profil-infos flex-column">
                <p class="service-profil-pseudo"></p>
                <p class="service-profil-prof"></p>
              </div>
              <div class="profil-mention flex-column">
                <span class="profil-verified"
                  ><svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="rgba(32,161,32,1)"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"
                    />
                    <path d="m9 12 2 2 4-4" />
                  </svg>
                </span>
                <p class="profil-top-rated">top rated</p>
              </div>
            </div>
          </div>
        </template>

        <p>Here are the services I offer:</p>

        <article id="my-services" class="flex-row flex-row"></article>
      </section>

      <section id="reviews">
        <template id="review-template" class="flex-column">
          <div class="review-card flex-column">
            <div class="review-infos flex-row">
              <div class="review-profil-container profil">
                <img src="" alt="review-profil" />
              </div>
              <div class="review-profil-infos flex-column">
                <p class="review-pseudo"></p>
                <p class="review-note flex-row">
                  <span class="review-note-value"></span
                  ><span class="review-note-star"></span>
                </p>
              </div>
            </div>
            <p class="review-comment">Great work, highly recommended!</p>
            <p class="review-date"></p>
          </div>
        </template>

        <h2>Reviews</h2>
        <p>Here are some reviews from my clients:</p>
        <article id="my-reviews-container" class="flex-column"></article>
      </section>
    </main>

    <footer id="foot"></footer>
    <script src="main.js" type="module"></script>
    <script src="services.js" type="module"></script>
    <script src="portfolio.js" type="module"></script>
    <script src="reviews.js" type="module"></script>
    <script src="user.js" type="module"></script>
  </body>
</html>
