<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<link rel="stylesheet" href="styles.css" />
		<link rel="stylesheet" href="/front-end/components/header/header.css" />
		<link rel="stylesheet" href="/front-end/components/footer/footer.css" />
		<link rel="stylesheet" href="/front-end/assets/styles/global.css" />
		<title>welcome</title>
	</head>
	<body>
		<header id="head"></header>

		<main>
			<div class="connexion-hero"></div>
			<div class="form-content">
				<h1 class="title-form">connexion</h1>
				<form action="" method="" class="connexion-form flex-column">
					<div class="input-group flex-column">
						<label for="email"
							><span>
								<svg
									xmlns="http://www.w3.org/2000/svg"
									width="24"
									height="24"
									viewBox="0 0 24 24"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round"
								>
									<path
										d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"
									/>
									<rect
										x="2"
										y="4"
										width="20"
										height="16"
										rx="2"
									/>
								</svg> </span
							><span>email:</span>
						</label>
						<input type="email" name="email" id="email" />
					</div>
					<div class="input-group flex-column">
						<label for="password">
							<span>
								<svg
									xmlns="http://www.w3.org/2000/svg"
									width="24"
									height="24"
									viewBox="0 0 24 24"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round"
								>
									<rect
										width="18"
										height="11"
										x="3"
										y="11"
										rx="2"
										ry="2"
									/>
									<path d="M7 11V7a5 5 0 0 1 10 0v4" />
								</svg>
							</span>
							<span>mot de passe: </span></label
						>
						<input
							type="password"
							name="password"
							id="password"
							required
						/>
						<p class="forgot-password">mot de passe oublié</p>
					</div>
					<button class="login-button btn-full" type="submit">
						se connecter
					</button>
				</form>
				<p class="not-account">
					vous n'avez pas de compte?
					<a href="/front-end/pages/register/index.html">
						creer un compte</a
					>
				</p>
			</div>
		</main>

		<footer id="foot"></footer>

		<script src="main.js" type="module"></script>
	</body>
</html>
